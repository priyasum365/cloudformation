AWSTemplateFormatVersion: 2010-09-09
Description: Cloud formation live coding

Parameters:
  Environment:
    Type: String
    Default: Dev
    AllowedValues: 
      - Dev
      - Prod
      - Stage

  CidrBlock:
    Type: String
    Default: 10.0.0.0/16
    AllowedValues: 
      - 10.0.0.0/16
      - 10.1.0.0/16
      - 10.2.0.0/16
Resources:
  myVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref CidrBlock
      Tags: 
        - 
          Key: Name
          Value: !Sub "CFT-VPC-${Environment}"
        -
          Key: Environment
          Value: !Ref Environment

  myIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: 
        -  
          Key: Name
          Value: !Sub "CFT-IGW-${Environment}"
        -
           Key: Environment
           Value: !Ref Environment

  VPCGatewayAttach:
      Type: AWS::EC2::VPCGatewayAttachment
      Properties:
        VpcId: !Ref myVPC
        InternetGatewayId: !Ref myIGW



Outputs:
  VPCId:
   Description: myVPC.CidrBlock 
   Value: !Ref myVPC
   Export:
      Name: VPCId
  
  VPCcidr:
    Description: vpccidr
    Value:  !GetAtt myVPC.CidrBlock
    Export:
      Name: VPCcidr

  IGW:
    Value:  !Ref myIGW
    Export:
      Name: IGW


  